plugins { id 'com.android.application' }
android {
    namespace 'org.shrek2.research'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'org.shrek2.research'
        minSdk 26
        targetSdk 35
        versionCode 116
        versionName '1.0.6'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    flavorDimensions 'device'
    productFlavors {
        modern { dimension 'device'; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
        legacy {
            dimension 'device'; applicationIdSuffix '.legacy'; minSdk 21
            versionNameSuffix '-android5-experimental'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        armv7 {
            dimension 'device'; applicationIdSuffix '.legacy'; minSdk 21
            versionNameSuffix '-armv7'
            ndk { abiFilters 'armeabi-v7a' }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['wav'] }
}
