plugins { id 'com.android.application' }
android {
    namespace 'org.shrek2.research'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'org.shrek2.research'
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName '1.10-shoulder-controls'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['wav'] }
}
